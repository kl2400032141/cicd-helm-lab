test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install -r requirements.txt
    - run: pytest -q

lint-chart:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - uses: azure/setup-helm@v4

    - run: helm lint chart
build:
  needs: [test, lint-chart]
  runs-on: ubuntu-latest

  permissions:
    contents: read
    packages: write

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set image
      run: |
        echo "IMAGE=ghcr.io/${{ github.repository_owner }}/lab-app" >> $GITHUB_ENV
        echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Build image
      run: |
        docker build -t $IMAGE:$TAG .

    - name: Push image
      run: |
        docker push $IMAGE:$TAG
deploy:
  needs: build
  runs-on: ubuntu-latest

  permissions:
    contents: read
    packages: read

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set image
      run: |
        echo "IMAGE=ghcr.io/${{ github.repository_owner }}/lab-app" >> $GITHUB_ENV
        echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Create kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: lab

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull image
      run: |
        docker pull $IMAGE:$TAG

    - name: Load image into kind
      run: |
        kind load docker-image $IMAGE:$TAG --name lab

    - name: Deploy with Helm
      run: |
        helm upgrade --install demo chart \
          --set image.repository=$IMAGE \
          --set image.tag=$TAG \
          --set image.pullPolicy=IfNotPresent \
          --atomic \
          --wait \
          --timeout 120s

    - name: Smoke test
      run: |
        kubectl port-forward svc/demo 8080:80 > /tmp/port-forward.log 2>&1 &
        sleep 5
        curl -f http://localhost:8080/healthz
        curl -f http://localhost:8080/